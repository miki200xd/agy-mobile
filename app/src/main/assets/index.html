<!DOCTYPE html>
<html lang="pl">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file: data: blob:; connect-src http: https:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1917">
<title>AIKO · AI Kooperation</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="aiko-192.png" type="image/png">
<style>
  :root {
    --bg: #1a1917;
    --surface: #252420;
    --surface2: #2f2d28;
    --border: #3a3832;
    --text: #eceae4;
    --muted: #9e9b91;
    --accent: #d97757;
    --accent-dim: rgba(217, 119, 87, 0.16);
    --user-bg: #2f2d28;
    --danger: #e05252;
    --ok: #5cb874;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100%; width: 100%; position: relative; }

  /* Drawer / Sidebar */
  #backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 40; backdrop-filter: blur(2px);
  }
  #backdrop.open { display: block; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: 300px; max-width: 85vw;
    background: #141311; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 50;
    transform: translateX(-100%); transition: transform 0.22s ease;
  }
  #sidebar.open { transform: translateX(0); }
  @media (min-width: 900px) {
    #sidebar { position: relative; transform: none; flex-shrink: 0; }
    #backdrop { display: none !important; }
    #btnMenu { display: none !important; }
  }
  .sb-head {
    padding: 14px 14px 10px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .sb-logo { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; }
  .sb-title { font-weight: 600; font-size: 16px; flex: 1; }
  .host-badge {
    font-size: 11px; padding: 2px 7px; border-radius: 99px;
    background: var(--accent-dim); color: var(--accent); font-weight: 600;
  }
  .sb-actions { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-secondary {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .sb-search {
    margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13px; outline: none;
  }
  .conv-list { flex: 1; overflow-y: auto; padding: 4px 8px 14px; }
  .conv-group {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.05em; padding: 10px 8px 4px;
  }
  .conv-item {
    padding: 10px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 2px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .conv-item:hover, .conv-item.active { background: var(--surface); }
  .conv-item.active { border-left: 3px solid var(--accent); padding-left: 7px; }
  .conv-title {
    font-size: 13.5px; color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 7px;
  }
  .ps-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 6px rgba(92,184,116,0.8); flex-shrink: 0; display: inline-block;
  }
  .cdx-tag {
    font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
    background: rgba(92,184,116,0.18); color: #7cd694; font-weight: 700; flex-shrink: 0;
  }
  .conv-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .sb-foot {
    padding: 10px 12px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }

  /* Main Area */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  #topbar {
    height: 54px; padding: 0 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: var(--bg);
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: transparent; color: var(--text); font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--surface); }
  #chatTitle {
    flex: 1; min-width: 0; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #modelPill {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap; max-width: 175px;
  }
  #modelPill .eff-tag { color: var(--accent); font-weight: 600; font-size: 11px; }
  .bubble pre { position: relative; }
  .copy-btn { cursor: pointer; font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border, #444);
    background: var(--surface, #2a2826); color: inherit; opacity: .85; }
  .copy-btn:hover { opacity: 1; }
  .bubble pre .copy-btn { position: absolute; top: 6px; right: 6px; }
  .bubble code.copyable { cursor: copy; }
  .msg-actions { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  #messages, #messages * { -webkit-user-select: text; user-select: text; }
  #aikoCtx { position: fixed; z-index: 9999; min-width: 190px; padding: 4px; border-radius: 10px;
    background: #2a2826; color: #eee; border: 1px solid #555; box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 14px; }
  #aikoCtx button { display: block; width: 100%; text-align: left; padding: 8px 12px; background: none; border: 0;
    color: inherit; border-radius: 6px; cursor: pointer; font: inherit; }
  #aikoCtx button:hover { background: #3d3a37; }
  .chat-img { max-width: 100%; max-height: 420px; border-radius: 10px; margin: 6px 0; display: block; cursor: zoom-in; background: #fff; }
  .bubble a { color: #7cb7ff; text-decoration: underline; cursor: pointer; }
  #certainBtn, #coopBtn, #memoryBtn {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: 99px; padding: 6px 10px; font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #certainBtn.active, #coopBtn.active {
    background: rgba(92,184,116,0.18); border-color: var(--ok); color: #7cd694;
  }
  #queueBar {
    display: none; flex-direction: column; gap: 5px;
    max-width: 820px; margin: 0 auto 6px;
  }
  #queueBar.has { display: flex; }
  .q-item {
    background: var(--surface2); border: 1px dashed var(--accent); border-radius: 10px;
    padding: 5px 10px; font-size: 12.5px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .q-tag { color: var(--accent); font-weight: 600; font-size: 11px; flex-shrink: 0; }
  .q-txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .route-feedback { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 4px; }
  .route-feedback button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .route-feedback-status { color: var(--muted); }
  .q-item button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 4px; }
  #btnStop { display: none; background: var(--danger); color: #fff; width: 36px; height: 36px; }
  #btnStop.show { display: flex; }

  /* Update Banner */
  #updateBar {
    display: none; background: rgba(217,119,87,0.16); border-bottom: 1px solid var(--accent);
    padding: 8px 12px; font-size: 12.5px; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #updateBar.show { display: flex; }
  #updateBar .u-txt { flex: 1; }
  #updateProgressWrap { display: none; width: 100%; height: 4px; background: var(--surface2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  #updateProgressFill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }

  /* Limits Panel in Sidebar */
  .limits-box {
    margin: 0 12px 8px; padding: 9px 10px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 11.5px; display: flex; flex-direction: column; gap: 6px;
  }
  .lim-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--text); }
  .lim-row { display: flex; flex-direction: column; gap: 3px; }
  .lim-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .lim-bar { height: 5px; border-radius: 99px; background: #141311; overflow: hidden; }
  .lim-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.3s; }
  .lim-fill.cdx { background: #5cb874; }
  .lim-fill.warn { background: #e0a040; }
  .lim-fill.high { background: var(--danger); }

  /* Model Picker Sheet */
  #modelSheet {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    z-index: 95; align-items: flex-end; justify-content: center; padding: 12px;
  }
  #modelSheet.open { display: flex; }
  .sheet-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    width: 100%; max-width: 440px; padding: 16px; display: flex; flex-direction: column; gap: 14px;
    margin-bottom: var(--safe-bottom);
  }
  .sheet-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .prov-seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 5px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .prov-btn {
    border: none; background: transparent; color: var(--muted); border-radius: 9px;
    padding: 9px 4px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .prov-btn.active { background: var(--surface2); color: var(--text); border: 1px solid var(--accent); }
  .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 220px; overflow-y: auto; }
  .m-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 11px; text-align: left; cursor: pointer; color: var(--text);
    display: flex; flex-direction: column; gap: 2px;
  }
  .m-card.active { border-color: var(--accent); background: var(--accent-dim); }
  .m-card .m-name { font-size: 13.5px; font-weight: 600; }
  .m-card .m-sub { font-size: 11px; color: var(--muted); }
  .effort-seg { display: flex; flex-wrap: wrap; gap: 6px; background: var(--bg); padding: 5px; border-radius: 11px; border: 1px solid var(--border); }
  .eff-btn {
    flex: 1 1 28%; border: none; background: transparent; color: var(--muted); border-radius: 8px;
    padding: 8px 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; text-transform: capitalize;
  }
  .eff-btn.active { background: var(--accent); color: #fff; }

  /* Messages */
  #messages {
    flex: 1; overflow-y: auto; padding: 14px 12px 24px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .empty-state {
    margin: auto; text-align: center; max-width: 340px; padding: 24px;
  }
  .empty-state img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 12px; }
  .empty-state h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
  .empty-state p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 99px; padding: 8px 13px; font-size: 13px; cursor: pointer;
  }
  .chip:active { background: var(--surface2); }

  .msg { display: flex; flex-direction: column; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg.user { align-items: flex-end; }
  .msg.assistant { align-items: flex-start; }
  .bubble {
    padding: 11px 14px; border-radius: 16px; font-size: 15px; line-height: 1.52;
    word-wrap: break-word; overflow-wrap: anywhere; max-width: 100%;
  }
  .msg.user .bubble {
    background: var(--user-bg); border: 1px solid var(--border);
    border-bottom-right-radius: 4px; max-width: 88%; white-space: pre-wrap;
  }
  .msg.assistant .bubble {
    background: transparent; padding: 4px 2px; width: 100%;
  }
  .msg.assistant .bubble p { margin: 0 0 10px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .msg.assistant .bubble pre {
    background: #121110; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.4;
  }
  .msg.assistant .bubble code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    background: var(--surface); padding: 1px 5px; border-radius: 5px; font-size: 0.9em;
  }
  .msg.assistant .bubble pre code { background: none; padding: 0; }
  .msg.assistant .bubble ul, .msg.assistant .bubble ol { margin: 4px 0 10px; padding-left: 20px; }
  .msg.assistant .bubble a { color: var(--accent); }
  .msg.assistant .bubble h1, .msg.assistant .bubble h2, .msg.assistant .bubble h3 {
    margin: 12px 0 6px; font-size: 1.08em;
  }
  .tool-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tool-pill {
    font-size: 12px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tool-pill.live { border-color: var(--accent); color: var(--accent); }
  .msg-footer { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Composer */
  #composerWrap {
    padding: 8px 10px calc(10px + var(--safe-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #attBar { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; max-width: 820px; margin-inline: auto; }
  #attBar.has { display: flex; }
  .att-chip {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 4px 8px; font-size: 12px; display: flex; align-items: center; gap: 6px;
  }
  .att-thumb { width: 28px; height: 28px; object-fit: cover; border-radius: 5px; }
  .att-chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .rc-box {
    margin: 0 12px 8px; padding: 8px 10px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .rc-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .rc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .rc-dot.on { background: var(--ok); }
  .host-pills { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .host-pill {
    font-size: 12px; padding: 4px 9px; border-radius: 99px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .host-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  #composer {
    max-width: 820px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    padding: 6px 8px; display: flex; align-items: flex-end; gap: 6px;
  }
  #composer:focus-within { border-color: #5c574d; }
  #inputBox {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-size: 15.5px; line-height: 1.4; max-height: 150px; min-height: 36px;
    padding: 7px 4px; resize: none; outline: none; font-family: inherit;
  }
  .c-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; padding: 0;
    background: transparent; color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .c-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .c-btn:hover, .c-btn:active { background: var(--surface2); color: var(--text); }
  #btnMic { color: var(--muted); background: transparent; }
  #btnMic.listening {
    background: var(--danger); color: #fff;
    animation: pulse 1.2s infinite;
  }
  #btnSend { background: var(--accent); color: #fff; width: 36px; height: 36px; }
  #btnSend.stop { background: var(--danger); }
  #btnSend:disabled { opacity: 0.45; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224,82,82,0.65); }
    70% { box-shadow: 0 0 0 12px rgba(224,82,82,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,82,82,0); }
  }
  #voiceHint {
    max-width: 820px; margin: 4px auto 0; font-size: 12px; color: var(--accent);
    min-height: 16px; text-align: center; display: none;
  }
  #voiceHint.show { display: block; }

  /* Settings Modal */
  #modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; align-items: center; justify-content: center; padding: 16px;
  }
  #modal.open { display: flex; }
  .modal-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 420px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .modal-card h3 { margin: 0; font-size: 17px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 10px; font-size: 14px; outline: none;
  }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  #teamDialog {
    width: min(420px, calc(100% - 28px)); padding: 20px; border-radius: 16px;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
  }
  #teamDialog::backdrop { background: #0009; }
  #teamDialog h2 { font-size: 18px; margin: 0 0 12px; }
  #teamDialog label { display: grid; gap: 5px; margin: 12px 0; }
  #teamDialog label[hidden] { display: none; }
  #teamDialog select { width: 100%; padding: 8px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  #teamError { color: #ff9b82; margin: 8px 0; }
  .team-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="backdrop" onclick="toggleSidebar(false)"></div>
  <aside id="sidebar">
    <div class="sb-head">
      <img class="sb-logo" src="aiko-192.png" alt="AIKO" onerror="this.style.display='none'">
      <span class="sb-title">AIKO <small style="color:var(--muted);font-weight:400">AI Kooperation</small></span>
      <span class="host-badge" id="hostBadge">LENOVO</span>
    </div>
    <div class="sb-actions">
      <button class="btn-primary" onclick="startNewChat()">＋ Nowa rozmowa</button>
      <button class="btn-secondary" onclick="startMemorySession()">🧠 Nowa sesja z pamięcią</button>
    </div>
    <div class="host-pills" id="hostPills"></div>
    <div class="rc-box">
      <div class="rc-row">
        <span><span class="rc-dot" id="rcDot"></span> Remote Control</span>
        <button class="btn-secondary" style="padding:3px 8px;font-size:11px" id="rcToggleBtn" onclick="toggleRemoteControl()">Start</button>
      </div>
      <div id="rcText" style="color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sprawdzanie...</div>
    </div>
    <div class="limits-box" id="limitsBox" style="display:none"></div>
    <input id="searchConv" class="sb-search" type="search" placeholder="Szukaj sesji..." oninput="renderConvList()">
    <div class="conv-list" id="convList"></div>
    <div class="sb-foot">
      <button class="btn-secondary" style="flex:1" onclick="openSettings()">⚙ Połączenie / Ustawienia</button>
      <button class="btn-secondary" onclick="loadConversations()" title="Odśwież">↻</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="btnMenu" onclick="toggleSidebar(true)">☰</button>
      <div id="chatTitle">Nowa rozmowa</div>
      <button id="modelPill" onclick="openModelSheet()"><span id="modelPillName">Neon</span><span class="eff-tag" id="modelPillEff">Med</span><span>▾</span></button>

<script>
const MEMORY_START_PROMPT = String.raw`Start sesji w AIKO dla Michała. Przeczytaj G:\Mój dysk\Claude\PAMIEC\memory\MEMORY.md. Otwieraj tylko notatki związane z bieżącym zadaniem. Potwierdź gotowość po polsku w maksymalnie dwóch zdaniach.`;
const AGY_MEMORY_PROMPT = String.raw` W Antigravity przeczytaj także G:\Mój dysk\Claude\PAMIEC\memory\antigravity\START_ANTIGRAVITY.md.`;

let MODEL_FAMILIES = [
  { id: 'Gemini 4 Neon', prov: 'gemini', short: 'Neon', sub: 'AGY · domyślny', efforts: ['Low', 'Medium', 'High', 'XHigh'] },
  { id: 'Gemini 4 Argon', prov: 'gemini', short: 'Argon', sub: 'AGY · głęboka analiza', efforts: ['Low', 'Medium', 'High'] },
  { id: 'Gemini 4 Hydrogen', prov: 'gemini', short: 'Hydrogen', sub: 'AGY · kod / narzędzia', efforts: ['Low', 'Medium', 'High', 'XHigh'] },
  { id: 'Gemini 3.8 Flash', prov: 'gemini', short: 'Flash', sub: 'AGY · ultraszybki', efforts: ['Low', 'Medium', 'High'] },
  { id: 'Claude Sonnet 5.5', prov: 'claude', short: 'Sonnet 5.5', sub: 'AGY · Anthropic', efforts: ['Low', 'Medium', 'High'] },
  { id: 'Claude Opus 5.5', prov: 'claude', short: 'Opus 5.5', sub: 'AGY · najmocniejszy', efforts: ['Low', 'Medium', 'High'] },
  { id: 'Codex gpt-6.2-sol', prov: 'codex', short: 'gpt-6.2-sol', sub: 'Codex · konto ChatGPT', efforts: ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'] },
];

const state = {
  baseUrl: localStorage.getItem('agy_base_url') || '',
  token: localStorage.getItem('agy_token') || '',
  cwd: localStorage.getItem('agy_cwd') || 'C:\\Users\\Michał\\Desktop\\CLOUDE',
  modelProvider: localStorage.getItem('agy_model_prov') || 'auto',
  modelFamily: localStorage.getItem('agy_model_family') || 'Auto',
  modelEffort: localStorage.getItem('agy_model_effort') || 'Auto',
  model: 'Gemini 4 Neon (Medium)',
  autoSendVoice: localStorage.getItem('agy_auto_send') === '1',
  pendingUpdateUrl: '',
  conversations: [],
  currentConvId: '',
  historyRequest: null,
  conversationCwd: '',
  messages: [],
  attachments: [],
  streaming: false,
  manualStop: false,
  partners: readTeamSelection(),
  certain: localStorage.getItem('aiko_certain') === '1',
  messageQueue: [],
  abortController: null,
  listening: false,
  recognition: null,
};

function readTeamSelection() {
  try {
    const saved = JSON.parse(localStorage.getItem('kiko_partners') || 'null');
    return Array.isArray(saved) ? saved.filter(item => typeof item === 'string').slice(0, 2) : [];
  } catch {
    return [];
  }
}

function engineForModel(model) {
  if (model === 'Auto') return 'Auto';
  if (model.startsWith('Codex ')) return 'Codex';
  if (model.startsWith('Claude Code ')) return 'Claude Code';
  return 'AGY';
}

function toggleCertain() {
  state.certain = !state.certain;
  localStorage.setItem('aiko_certain', state.certain ? '1' : '0');
  renderCertain();
}

function renderCertain() {
  const b = document.getElementById('certainBtn');
  if (b) b.classList.toggle('active', !!state.certain);
}

function teamValidation(partners) {
  const engines = partners.map(engineForModel);
  if (new Set(engines).size !== engines.length || engines.includes(engineForModel(state.model))) {
    return 'Wybierz inny silnik dla każdego uczestnika.';
  }
  return '';
}

function syncCoopUi() {
  const btn = document.getElementById('coopBtn');
  btn.classList.toggle('active', state.partners.length > 0);
  btn.textContent = state.partners.length ? `🤝 ${state.partners.length + 1}×` : '🤝 Solo';
  renderCertain();
}

function openCoopSettings() {
  const dialog = document.getElementById('teamDialog');
  document.getElementById('teamLead').textContent = 'Prowadzący — ' + state.model;
  document.getElementById('teamSize').value = String(state.partners.length);
  document.getElementById('teamError').textContent = '';
  for (const index of [1, 2]) {
    const select = document.querySelector(`#teamPartner${index} select`);
    select.replaceChildren(new Option('Wybierz model', ''));
    for (const engine of ['AGY', 'Codex', 'Claude Code']) {
      if (engine === engineForModel(state.model)) continue;
      const group = document.createElement('optgroup');
      group.label = engine;
      for (const family of MODEL_FAMILIES) {
        if (engineForModel(family.id) !== engine) continue;
        for (const effort of family.efforts) {
          const model = `${family.id} (${effort})`;
          group.append(new Option(model, model));
        }
      }
      if (group.children.length) select.append(group);
    }
    select.value = state.partners[index - 1] || '';
  }
  updateTeamFields();
  if (!dialog.open) dialog.showModal();
}

function updateTeamFields() {
  const size = Number(document.getElementById('teamSize').value);
  for (const index of [1, 2]) {
    const field = document.getElementById(`teamPartner${index}`);
    field.hidden = index > size;
    field.querySelector('select').required = index <= size;
  }
}

function saveCoopSettings(event) {
  event.preventDefault();
  const size = Number(document.getElementById('teamSize').value);
  const partners = [1, 2].slice(0, size).map(index =>
    document.querySelector(`#teamPartner${index} select`).value);
  const error = teamValidation(partners);
  document.getElementById('teamError').textContent = error;
  if (error) return;
  state.partners = partners;
  localStorage.setItem('kiko_partners', JSON.stringify(partners));
  syncCoopUi();
  document.getElementById('teamDialog').close();
}

document.addEventListener('keydown', (event) => {
  if (event.key.toLowerCase() === 'a' && event.ctrlKey && event.shiftKey) {
    event.preventDefault();
    openCoopSettings();
  }
});

function getActiveFamily() {
  if (state.modelProvider === 'auto' || state.modelFamily === 'Auto') {
    return { id: 'Auto', prov: 'auto', short: '⚡ Auto', sub: 'Dobiera model według zadania oraz limitów 5 h i tygodniowego', efforts: ['Auto'] };
  }
  return MODEL_FAMILIES.find(f => f.id === state.modelFamily) || MODEL_FAMILIES[0];
}

function syncFullModel() {
  const fam = getActiveFamily();
  state.modelFamily = fam.id;
  state.modelProvider = fam.prov;
  const effs = fam.efforts || ['Low', 'Medium', 'High'];
  const match = effs.find(e => e.toLowerCase() === (state.modelEffort || '').toLowerCase());
  state.modelEffort = match || (effs.find(e => e.toLowerCase() === 'medium') || effs[0]);
  state.model = fam.id === 'Auto' ? 'Auto' : `${fam.id} (${state.modelEffort})`;
  const nEl = document.getElementById('modelPillName');
  const eEl = document.getElementById('modelPillEff');
  if (nEl) nEl.textContent = fam.short;
  if (eEl) eEl.textContent = fam.id === 'Auto' ? 'Router' : (state.modelEffort.toLowerCase() === 'medium' ? 'Med' : state.modelEffort);
}

function pickProvider(prov) {
  state.modelProvider = prov;
  localStorage.setItem('agy_model_prov', prov);
  if (prov === 'auto') {
    state.modelFamily = 'Auto';
    localStorage.setItem('agy_model_family', 'Auto');
    syncFullModel();
    openModelSheet();
    return;
  }
  const first = MODEL_FAMILIES.find(f => f.prov === prov);
  if (first && !MODEL_FAMILIES.some(f => f.id === state.modelFamily && f.prov === prov)) {
    state.modelFamily = first.id;
    localStorage.setItem('agy_model_family', first.id);
    syncFullModel();
  }
  openModelSheet();
}

function openModelSheet() {
  document.querySelectorAll('#provSeg .prov-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.prov === state.modelProvider);
  });
  const grid = document.getElementById('modelGrid');
  grid.innerHTML = '';
  const list = state.modelProvider === 'auto'
    ? [getActiveFamily()]
    : MODEL_FAMILIES.filter(f => f.prov === state.modelProvider);
  list.forEach(f => {
    const b = document.createElement('button');
    b.className = 'm-card' + (f.id === state.modelFamily ? ' active' : '');
    if (state.modelProvider === 'auto') b.style.gridColumn = '1 / -1';
    b.innerHTML = `<span class="m-name">${escapeHtml(f.short)}</span><span class="m-sub">${escapeHtml(f.sub || '')}</span>`;
    b.onclick = () => {
      state.modelFamily = f.id;
      localStorage.setItem('agy_model_family', f.id);
      syncFullModel();
      openModelSheet();
    };
    grid.appendChild(b);
  });
  const fam = getActiveFamily();
  const effBox = document.getElementById('effortSeg');
  effBox.innerHTML = '';
  (fam.efforts || ['Low', 'Medium', 'High']).forEach(eff => {
    const btn = document.createElement('button');
    btn.className = 'eff-btn' + (eff.toLowerCase() === state.modelEffort.toLowerCase() ? ' active' : '');
    btn.textContent = eff;
    btn.onclick = () => pickEffort(eff);
    effBox.appendChild(btn);
  });
  document.getElementById('modelSheet').classList.add('open');
}
function closeModelSheet() { document.getElementById('modelSheet').classList.remove('open'); }
function pickEffort(eff) {
  state.modelEffort = eff;
  localStorage.setItem('agy_model_effort', eff);
  syncFullModel();
  openModelSheet();
}

async function openOnLaptop() {
  const label = state.currentConvId ? 'tę rozmowę' : `nową rozmowę (${state.model})`;
  try {
    const r = await fetch(apiBase() + '/api/open-terminal', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        conversation_id: state.currentConvId,
        model: state.model,
        cwd: state.conversationCwd || state.cwd,
      }),
    });
    const d = await r.json();
    if (d.ok) alert(`Otwarto ${label} w PowerShellu na laptopie.`);
    else alert('Nie udało się otworzyć PowerShella: ' + (d.error || 'błąd'));
  } catch {
    alert('Brak połączenia z laptopem.');
  }
}

// Pick token/server from URL query on first QR scan
(function initFromUrl() {
  const params = new URLSearchParams(location.search);
  const t = params.get('token');
  const s = params.get('server');
  try {
    if (s && t) {
      state.baseUrl = normalizeServerUrl(s);
      localStorage.setItem('agy_base_url', state.baseUrl);
    } else if (t && location.protocol !== 'file:') {
      state.baseUrl = '';
      localStorage.setItem('agy_base_url', '');
    }
    if (t) { state.token = t; localStorage.setItem('agy_token', t); }
  } catch {}
  if (t || s) history.replaceState({}, '', location.pathname);
})();

function normalizeServerUrl(value) {
  if (!value) return '';
  const url = new URL(value);
  if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password) throw new Error('Nieprawidłowy adres');
  return url.origin;
}

function apiBase() { return normalizeServerUrl(state.baseUrl); }
function authHeaders(extra = {}) {
  const h = { ...extra };
  if (state.token) h['Authorization'] = 'Bearer ' + state.token;
  return h;
}

function toggleSidebar(open) {
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('backdrop').classList.toggle('open', open);
}

function openSettings() {
  document.getElementById('cfgUrl').value = state.baseUrl;
  document.getElementById('cfgToken').value = state.token;
  document.getElementById('cfgCwd').value = state.cwd;
  document.getElementById('cfgAutoSend').checked = state.autoSendVoice;
  document.getElementById('modal').classList.add('open');
}
function closeSettings() { document.getElementById('modal').classList.remove('open'); }
function saveSettings() {
  if (state.streaming || state.listening) return;
  let url;
  try {
    url = normalizeServerUrl(document.getElementById('cfgUrl').value.trim());
  } catch {
    alert('Wpisz adres serwera zaczynający się od http:// lub https://.');
    return;
  }
  const token = document.getElementById('cfgToken').value.trim();
  if ((url !== state.baseUrl || token !== state.token) && !startNewChat()) return;
  state.baseUrl = url;
  state.token = token;
  state.cwd = document.getElementById('cfgCwd').value.trim() || 'C:\\Users\\Michał\\Desktop\\CLOUDE';
  state.autoSendVoice = document.getElementById('cfgAutoSend').checked;
  localStorage.setItem('agy_base_url', state.baseUrl);
  localStorage.setItem('agy_token', state.token);
  localStorage.setItem('agy_cwd', state.cwd);
  localStorage.setItem('agy_auto_send', state.autoSendVoice ? '1' : '0');
  closeSettings();
  syncCoopUi();
bootstrap();
}

async function bootstrap() {
  try {
    const r = await fetch(apiBase() + '/api/info', { headers: authHeaders() });
    if (r.status === 401) { openSettings(); return; }
    const info = await r.json();
    if (Array.isArray(info.model_catalog) && info.model_catalog.length) {
      MODEL_FAMILIES = info.model_catalog;
      document.querySelector('[data-prov="claude-code"]').hidden =
        !MODEL_FAMILIES.some(f => f.prov === 'claude-code');
    }
    document.getElementById('hostBadge').textContent = info.host_label || 'LENOVO';
    updateRemoteControlUi(info.remote_control_status || '');
    renderLimits(info.limits || {});
    renderHostPills(info.host_label || 'LENOVO');
    syncFullModel();
    await loadConversations();
    closeStaleSessions();
    renderMessages();
    checkForUpdates(false);
  } catch (e) {
    renderErrorBanner('Brak połączenia z AIKO. Kliknij ☰ → Połączenie / Ustawienia.');
  }
}

function fmtEpoch(ep, withDay) {
  if (!ep) return '';
  const d = new Date(Number(ep) * 1000);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (!withDay) return `${hh}:${mm}`;
  const dni = ['nd', 'pn', 'wt', 'śr', 'cz', 'pt', 'sb'];
  return `${dni[d.getDay()]} ${hh}:${mm}`;
}

function barClass(pct, isCdx) {
  if (pct >= 85) return 'high';
  if (pct >= 65) return 'warn';
  return isCdx ? 'cdx' : '';
}

function renderLimits(lim) {
  const box = document.getElementById('limitsBox');
  if (!lim || (!lim.agy && !lim.codex && !lim.claude)) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  let html = '<div class="lim-head"><span>Zużycie limitów</span><button class="btn-secondary" style="padding:1px 6px;font-size:10px" onclick="refreshLimits()">↻</button></div>';
  if (lim.agy) {
    const g5 = lim.agy.g5 == null ? null : Math.round(lim.agy.g5);
    const gw = lim.agy.gw == null ? null : Math.round(lim.agy.gw);
    html += `<div class="lim-row"><div class="lim-label"><span>AGY 5h (${fmtEpoch(lim.agy.g5r, false)})</span><span>${g5 == null ? '—' : g5 + '%'}</span></div><div class="lim-bar"><div class="lim-fill ${barClass(g5, false)}" style="width:${Math.min(100,g5||0)}%"></div></div></div>`;
    html += `<div class="lim-row"><div class="lim-label"><span>AGY tydz. (${fmtEpoch(lim.agy.gwr, true)})</span><span>${gw == null ? '—' : gw + '%'}</span></div><div class="lim-bar"><div class="lim-fill ${barClass(gw, false)}" style="width:${Math.min(100,gw||0)}%"></div></div></div>`;
  }
  if (lim.codex) {
    const p5 = Math.round(lim.codex.p5 || 0);
    const pw = Math.round(lim.codex.pw || 0);
    html += `<div class="lim-row"><div class="lim-label"><span>Codex 5h (${fmtEpoch(lim.codex.r5, false)})</span><span>${p5}%</span></div><div class="lim-bar"><div class="lim-fill ${barClass(p5, true)}" style="width:${Math.min(100,p5)}%"></div></div></div>`;
    html += `<div class="lim-row"><div class="lim-label"><span>Codex tydz. (${fmtEpoch(lim.codex.rw, true)})</span><span>${pw}%</span></div><div class="lim-bar"><div class="lim-fill ${barClass(pw, true)}" style="width:${Math.min(100,pw)}%"></div></div></div>`;
  }
  if (lim.claude) {
    const c5 = lim.claude.p5 == null ? null : Math.round(lim.claude.p5);
    const cw = lim.claude.pw == null ? null : Math.round(lim.claude.pw);
    html += `<div class="lim-row"><div class="lim-label"><span>Claude Code 5h (${fmtEpoch(lim.claude.r5, false)})</span><span>${c5 == null ? '—' : c5 + '%'}</span></div><div class="lim-bar"><div class="lim-fill ${barClass(c5, false)}" style="width:${Math.min(100,c5)}%"></div></div></div>`;
    html += `<div class="lim-row"><div class="lim-label"><span>Claude Code tydz. (${fmtEpoch(lim.claude.rw, true)})</span><span>${cw == null ? '—' : cw + '%'}</span></div><div class="lim-bar"><div class="lim-fill ${barClass(cw, false)}" style="width:${Math.min(100,cw)}%"></div></div></div>`;
  }
  box.innerHTML = html;
}

async function checkForUpdates(manual) {
  const isNative = !!(window.AndroidVoice && typeof window.AndroidVoice.getAppVersionCode === 'function');
  const curCode = isNative ? window.AndroidVoice.getAppVersionCode() : 0;
  const curName = isNative ? window.AndroidVoice.getAppVersionName() : 'web';
  const verEl = document.getElementById('appVerInfo');
  if (verEl) verEl.textContent = isNative ? `Wersja: v${curName} (build ${curCode})` : 'Tryb: przeglądarka';
  if (!isNative && !manual) return;
  try {
    const r = await fetch('https://api.github.com/repos/miki200xd/agy-mobile/releases/latest');
    if (!r.ok) return;
    const rel = await r.json();
    const tag = rel.tag_name || '';
    const m = tag.match(/(\d+)$/);
    const remoteCode = m ? parseInt(m[1], 10) : 0;
    const asset = (rel.assets || []).find(a => a.name === 'AGY_Mobile.apk');
    if (asset && remoteCode > curCode) {
      state.pendingUpdateUrl = asset.browser_download_url;
      document.getElementById('updateBarText').textContent = `Dostępna aktualizacja ${tag}`;
      document.getElementById('updateBar').classList.add('show');
    } else if (manual) {
      alert(`Masz najnowszą wersję (${tag || 'v' + curName}).`);
    }
  } catch {
    if (manual) alert('Nie udało się sprawdzić aktualizacji.');
  }
}

function renderConvList() {
  const q = (document.getElementById('searchConv').value || '').toLowerCase();
  const list = document.getElementById('convList');
  list.innerHTML = '';
  const todayStr = new Date().toISOString().slice(0, 10);
  const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const groups = { 'Dzisiaj': [], 'Wczoraj': [], 'Wcześniej': [] };

  state.conversations.forEach(c => {
    if (q && !(c.title + ' ' + c.preview).toLowerCase().includes(q)) return;
    const d = (c.last_modified || '').slice(0, 10);
    if (d === todayStr) groups['Dzisiaj'].push(c);
    else if (d === yest) groups['Wczoraj'].push(c);
    else groups['Wcześniej'].push(c);
  });

  Object.entries(groups).forEach(([label, arr]) => {
    if (!arr.length) return;
    const g = document.createElement('div');
    g.className = 'conv-group';
    g.textContent = label;
    list.appendChild(g);
    arr.forEach(c => {
      const div = document.createElement('div');
      div.className = 'conv-item' + (c.id === state.currentConvId ? ' active' : '');
      div.onclick = () => selectConversation(c);
      div.dataset.convId = c.id;
      const t = document.createElement('div');
      t.className = 'conv-title';
      const dot = c.open_in_ps ? '<span class="ps-dot" title="Otwarta w PowerShellu"></span>' : '';
      const cdx = c.id.startsWith('claude:') ? '<span class="cdx-tag">Claude</span>' :
        c.id.startsWith('codex:') ? '<span class="cdx-tag">GPT</span>' : '';
      t.innerHTML = `${dot}${cdx}<span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(c.title || c.id.slice(0, 8))}</span>`;
      const m = document.createElement('div');
      m.className = 'conv-meta';
      const tm = (c.last_modified || '').slice(11, 16);
      m.innerHTML = `<span>${c.step_count == null ? '' : c.step_count + ' kroków'}</span><span>${tm}</span>`;
      div.append(t, m);
      list.appendChild(div);
    });
  });
}

async function selectConversation(conv) {
  if (state.streaming || state.listening || !canLeaveQueue()) return;
  state.historyRequest?.abort();
  const request = new AbortController();
  state.historyRequest = request;
  state.currentConvId = conv.id;
  state.conversationCwd = conv.workspace || '';
  state.messages = [];
  document.getElementById('chatTitle').textContent = conv.title || conv.id.slice(0, 8);
  toggleSidebar(false);
  renderConvList();
  renderMessages();
  if (state.modelProvider !== 'auto') {
    const provider = conv.id.startsWith('codex:') ? 'codex' : conv.id.startsWith('claude:') ? 'claude-code' : 'gemini';
    const currentEngine = engineForModel(state.model);
    const sessionEngine = engineForModel(provider === 'codex' ? 'Codex ' : provider === 'claude-code' ? 'Claude Code ' : '');
    if (currentEngine !== sessionEngine) {
      const family = MODEL_FAMILIES.find(f => f.prov === provider && conv.model?.startsWith(f.id + ' ('))
        || MODEL_FAMILIES.find(f => f.prov === provider);
      if (family) {
        state.modelProvider = provider;
        state.modelFamily = family.id;
        state.modelEffort = conv.model?.match(/\((\w+)\)$/)?.[1] || 'Medium';
        syncFullModel();
      }
    }
  }
  try {
    const r = await fetch(apiBase() + '/api/conversations/' + encodeURIComponent(conv.id) + '/messages', {
      headers: authHeaders(), signal: request.signal,
    });
    if (!r.ok) throw new Error(await responseError(r));
    const data = await r.json();
    if (state.historyRequest !== request) return;
    state.messages = data.messages || [];
    renderMessages();
  } catch (e) {
    if (state.historyRequest === request && e.name !== 'AbortError') {
      renderErrorBanner('Nie udało się wczytać historii rozmowy. ' + e.message);
    }
  } finally {
    if (state.historyRequest === request) state.historyRequest = null;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMarkdown(md) {
  const fragments = [];
  const preserve = html => '\u0001' + (fragments.push(html) - 1) + '\u0002';
  let html = escapeHtml((md || '').replace(/[\u0001\u0002]/g, ''));
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => preserve('<pre><code>' + code.replace(/^\w*\n/, '') + '</code></pre>'));
  html = html.replace(/`([^`]+)`/g, (_, code) => preserve('<code>' + code + '</code>'));
  html = html.replace(/!\[([^\]]*)\]\(([^)\n]+)\)/g, (_, alt, src) => {
    src = src.trim();
    const web = /^https?:\/\//i.test(src);
    return preserve('<img class="chat-img" alt="' + alt + '" ' + (web ? 'src="' + src + '" referrerpolicy="no-referrer"' : 'data-local="' + src + '"') + '>');
  });
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) =>
    preserve('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>'));
  html = html.replace(/(^|[\s(>])(https?:\/\/[^\s<)\u0001]+[^\s<).,;:!?\u0001])/g, (_, lead, url) =>
    lead + preserve('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>'));
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>').replace(/<\/ul>\s*<ul>/g, '');
  html = html.replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>');
  return '<p>' + html.replace(/\u0001(\d+)\u0002/g, (_, i) => fragments[i]) + '</p>';
}

function renderMessages() {
  const box = document.getElementById('messages');
  const sel = window.getSelection && window.getSelection();
  const lastMsg = state.messages[state.messages.length - 1];
  const finished = lastMsg && lastMsg.role === 'assistant' && lastMsg.succeeded !== undefined;
  if (state.streaming && !finished && sel && !sel.isCollapsed && sel.anchorNode && box.contains(sel.anchorNode)) {
    state._renderDeferred = true;   // uzytkownik zaznacza tekst: nie przebudowuj DOM, dokoncz po zwolnieniu zaznaczenia
    return;
  }
  state._renderDeferred = false;
  box.innerHTML = '';
  if (!state.messages.length) {
    box.innerHTML = `
      <div class="empty-state">
        <img src="aiko-192.png" alt="AIKO" onerror="this.style.display='none'">
        <h2>Cześć Michał 👋</h2>
        <p>Pisz lub dyktuj. Wybierz silnik i zdecyduj, czy ma pracować sam, czy w zespole.</p>
        <div class="quick-chips">
          <button class="chip" onclick="quickSend('Sprawdź moje dzisiejsze maile w Gmailu')">📧 Sprawdź Gmail</button>
          <button class="chip" onclick="quickSend('ss')">📸 Zrzut ekranu (ss)</button>
          <button class="chip" onclick="startMemorySession()">🧠 Załaduj pamięć</button>
        </div>
      </div>`;
    return;
  }
  state.messages.forEach(m => box.appendChild(buildMsgEl(m)));
  box.scrollTop = box.scrollHeight;
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = '✓ Skopiowano';
    setTimeout(() => { btn.textContent = old; }, 1400);
  }
}

function makeCopyBtn(label, getText) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'copy-btn';
  b.textContent = label;
  b.title = 'Kopiuj do schowka';
  b.onclick = (e) => { e.stopPropagation(); copyText(getText(), b); };
  return b;
}

async function loadLocalImages(bubble) {
  for (const img of bubble.querySelectorAll('img[data-local]')) {
    const path = img.getAttribute('data-local').replace(/&amp;/g, '&');
    img.removeAttribute('data-local');
    try {
      const r = await fetch(apiBase() + '/api/file?path=' + encodeURIComponent(path), { headers: authHeaders() });
      if (!r.ok) throw new Error(String(r.status));
      const url = URL.createObjectURL(await r.blob());
      img.src = url;
      img.onclick = () => window.open(url, '_blank');
    } catch {
      img.replaceWith(Object.assign(document.createElement('span'), { textContent: '🖼 [nie udało się wczytać obrazu: ' + path + ']' }));
    }
  }
}

function decorateBubble(bubble) {
  loadLocalImages(bubble);
  bubble.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    pre.appendChild(makeCopyBtn('📋', () => (code || pre).innerText.replace(/\n$/, '')));
  });
  bubble.querySelectorAll('code').forEach(c => {
    if (c.closest('pre')) return;
    c.classList.add('copyable');
    c.title = 'Kliknij, aby skopiować';
    c.onclick = () => copyText(c.innerText, null);
  });
}

function buildMsgEl(m) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + m.role;
  if (m.tools && m.tools.length) {
    const pills = document.createElement('div');
    pills.className = 'tool-pills';
    m.tools.forEach(t => {
      const p = document.createElement('span');
      p.className = 'tool-pill' + (t.live ? ' live' : '');
      p.textContent = '⚙ ' + t.label;
      pills.appendChild(p);
    });
    wrap.appendChild(pills);
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  if (m.role === 'user') b.textContent = m.text;
  else b.innerHTML = m.text ? renderMarkdown(m.text) : `<span style="color:var(--muted)" class="live-think">${escapeHtml(m.liveStatus || 'Myślę...')}</span>`;
  if (m.role !== 'user' && m.text) decorateBubble(b);
  wrap.appendChild(b);

  if (m.footer || m.liveFooter) {
    const f = document.createElement('div');
    f.className = 'msg-footer';
    f.textContent = m.footer || m.liveFooter;
    wrap.appendChild(f);
  }
  const routeId = m.route_id || m.meta?.route_id;
  if (routeId) {
    const feedback = document.createElement('div');
    feedback.className = 'route-feedback';
    feedback.setAttribute('aria-label', 'Ocena odpowiedzi Auto');
    const status = document.createElement('span');
    status.className = 'route-feedback-status';
    status.setAttribute('role', 'status');
    status.textContent = m.voteError || '';
    for (const [vote, label] of [[1, 'Pomogło'], [-1, 'Nie pomogło']]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn-secondary';
      button.textContent = label;
      button.disabled = !!m.votePending;
      button.setAttribute('aria-pressed', String(m.vote === vote));
      button.onclick = () => rateAutoAnswer(m, routeId, vote);
      feedback.appendChild(button);
    }
    feedback.appendChild(status);
    if (m.role !== 'user' && m.text) feedback.insertBefore(makeCopyBtn('📋 Kopiuj odpowiedź', () => m.text), feedback.firstChild);
    wrap.appendChild(feedback);
  } else if (m.role !== 'user' && m.text) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.appendChild(makeCopyBtn('📋 Kopiuj odpowiedź', () => m.text));
    wrap.appendChild(actions);
  }
  return wrap;
}

async function rateAutoAnswer(message, routeId, vote) {
  if (message.votePending || message.vote === vote) return;
  message.votePending = true;
  message.voteError = '';
  renderMessages();
  try {
    const response = await fetch(apiBase() + '/api/router-feedback', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ id: routeId, vote }),
    });
    if (!response.ok) throw new Error(await responseError(response));
    message.vote = vote;
  } catch {
    message.voteError = 'Nie zapisano oceny. Spróbuj ponownie.';
  } finally {
    message.votePending = false;
    renderMessages();
  }
}

async function compressImageIfNeeded(file, dataUrl) {
  if (!file.type || !file.type.startsWith('image/') || file.size < 350000) return dataUrl;
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1600;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function handleFileSelect(ev) {
  const files = Array.from(ev.target.files || []);
  if (!files.length) return;
  await uploadFiles(files);
  ev.target.value = '';
}

async function uploadFiles(files) {
  for (const file of files) {
    let dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
    dataUrl = await compressImageIfNeeded(file, dataUrl);
    try {
      const r = await fetch(apiBase() + '/api/upload', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ filename: file.name, data: dataUrl }),
      });
      const res = await r.json();
      if (res.path) {
        if (file.type && file.type.startsWith('image/')) res.preview = dataUrl;
        state.attachments.push(res);
        renderAttachments();
      }
    } catch {}
  }
}

document.addEventListener('paste', (e) => {
  const items = Array.from(e.clipboardData?.items || []);
  const images = items.filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (!images.length) return;
  e.preventDefault();
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  uploadFiles(images.map((f, n) => new File([f], `wklejone-${stamp}-${n + 1}.${(f.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: f.type })));

function lineAtPoint(x, y) {
  const sel = window.getSelection();
  const saved = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  let text = '';
  try {
    const range = document.caretRangeFromPoint ? document.caretRangeFromPoint(x, y) : null;
    if (range) {
      sel.removeAllRanges();
      sel.addRange(range);
      sel.modify('move', 'backward', 'lineboundary');
      sel.modify('extend', 'forward', 'lineboundary');
      text = sel.toString().trim();
    }
  } catch {}
  sel.removeAllRanges();
  if (saved) sel.addRange(saved);
  return text;
}

  const convEl = e.target.closest('.conv-item');
  if (convEl && convEl.dataset.convId) {

    return;
  }
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return; // telefon: zostaw natywne menu
  const field = e.target.closest('input, textarea');
  const msgEl = e.target.closest('#messages .msg');
  if (!field && !msgEl) return;

  const selected = (window.getSelection().toString() || '').trim();
  const items = [];
  if (field) {
    const picked = field.value.substring(field.selectionStart || 0, field.selectionEnd || 0);
    if (picked) {
      items.push(['Kopiuj', () => copyText(picked, null)]);
      items.push(['Wytnij', () => { copyText(picked, null); field.setRangeText('', field.selectionStart, field.selectionEnd, 'end'); field.dispatchEvent(new Event('input')); }]);
    }
    items.push(['Wklej', async () => {
      try { const clip = await navigator.clipboard.readText(); field.setRangeText(clip, field.selectionStart, field.selectionEnd, 'end'); field.dispatchEvent(new Event('input')); field.focus(); } catch {}
    }]);
  } else {
    const line = selected ? '' : lineAtPoint(e.clientX, e.clientY);
    if (selected) items.push(['Kopiuj zaznaczenie', () => copyText(selected, null)]);
    if (line) items.push(['Kopiuj tę linijkę', () => copyText(line, null)]);

  menu.id = 'aikoCtx';
  items.forEach(([label, action]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.onclick = () => { closeAikoMenu(); action(); };
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(e.clientX, window.innerWidth - w - 8) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - h - 8) + 'px';
});

function enqueueDraft() {
  const box = document.getElementById('inputBox');
  const text = box.value.trim();
  const atts = state.attachments.map(a => a.path);
  if (!text && !atts.length) return true;
  if (teamValidation(state.partners)) {
    openCoopSettings();
    document.getElementById('teamError').textContent = teamValidation(state.partners);
    return false;
  }
  state.attachments = [];
  renderAttachments();
  box.value = '';
  autoGrow(box);
  const item = { text, atts, partners: [...state.partners], model: state.model,
    cwd: state.conversationCwd || state.cwd, parts: 1 };
  const last = state.messageQueue.at(-1);
  if (last && last.model === item.model && last.cwd === item.cwd
      && JSON.stringify(last.partners) === JSON.stringify(item.partners)) {
    const combined = {
      ...last,
      text: [last.text, item.text].filter(Boolean).join('\n\n'),
      atts: [...new Set([...last.atts, ...item.atts])],
      parts: last.parts + 1,
    };
    const encoded = new TextEncoder().encode(JSON.stringify(combined));
    if (combined.atts.length <= 20 && encoded.byteLength < 500 * 1024) {
      state.messageQueue[state.messageQueue.length - 1] = combined;
    } else {
      state.messageQueue.push(item);
    }
  } else {
    state.messageQueue.push(item);
  }
  renderQueue();
  updateSendUi();
  return true;
}

function sendNextQueued() {
  if (state.streaming || state.listening || state.historyRequest || !state.messageQueue.length) return;
  const next = state.messageQueue.shift();
  renderQueue();
  void sendMessage(next);
}

const SVG_SEND = '<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';

function fmtTok(n) {
  if (!n) return '0';
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
}

function fmtUsageFooter(sec, usage, modelLabel) {
  const parts = [];
  if (sec != null) parts.push(`⏱ ${Number(sec).toFixed(1)}s`);
  if (usage && (usage.total_tokens || usage.input_tokens || usage.output_tokens)) {
    const tot = usage.total_tokens || ((usage.input_tokens || 0) + (usage.output_tokens || 0));
    const detail = (usage.input_tokens || usage.output_tokens)
      ? ` (wej ${fmtTok(usage.input_tokens)} / wyj ${fmtTok(usage.output_tokens)})`
      : '';
    parts.push(`~${fmtTok(tot)} tok${detail}`);
  }
  if (modelLabel) parts.push(modelLabel);
  return parts.join(' · ');
}

function endSession() {
  if (state.streaming) return;
  if (!confirm('Zakończyć sesję? Model streści rozmowę i zapisze ją we wspólnej pamięci.')) return;
  const box = document.getElementById('inputBox');
  box.value = 'Kończę sesję';
  sendMessage();
}

async function sendMessage(queuedItem = null) {
  if (state.streaming || state.historyRequest) {
    if (!queuedItem && state.streaming) enqueueDraft();
    return;
  }
  if (!queuedItem && !state.listening && state.messageQueue.length) {
    if (enqueueDraft()) sendNextQueued();
    return;
  }
  const box = document.getElementById('inputBox');
  let text, atts, partners, useModel;
  if (queuedItem) {
    text = queuedItem.text;
    atts = queuedItem.atts || [];
    partners = queuedItem.partners || [];
    useModel = queuedItem.model || state.model;
  } else {
    text = box.value.trim();
    if (state.listening) {
      finishDictation(true);
      return;
    }
    if (!text && !state.attachments.length) return;
    atts = state.attachments.map(a => a.path);
    partners = [...state.partners];
    if (teamValidation(partners)) {
      openCoopSettings();
      document.getElementById('teamError').textContent = teamValidation(partners);
      return;
    }
    useModel = state.model;
    state.attachments = [];
    renderAttachments();
    box.value = '';
    autoGrow(box);
  }
  state.manualStop = false;

  state.messages.push({ role: 'user', text: text + (atts.length ? `\n[Załączniki: ${atts.length}]` : '') });
  const tStart = Date.now();
  const assistantMsg = { role: 'assistant', text: '', tools: [], footer: '', liveStatus: '⏱ 0.0s · Myślę...', liveFooter: '⏱ 0.0s', _usage: null };
  state.messages.push(assistantMsg);
  renderMessages();

  setStreaming(true);
  state.abortController = new AbortController();
  const timerId = setInterval(() => {
    const sec = (Date.now() - tStart) / 1000;
    assistantMsg.liveStatus = `⏱ ${sec.toFixed(1)}s · Myślę...`;
    assistantMsg.liveFooter = fmtUsageFooter(sec, assistantMsg._usage, '');
    const nodes = document.querySelectorAll('#messages .msg.assistant');
    const last = nodes[nodes.length - 1];
    if (last) {
      const lt = last.querySelector('.live-think');
      if (lt) lt.textContent = assistantMsg.liveStatus;
      const ft = last.querySelector('.msg-footer');
      if (ft && !assistantMsg.footer) ft.textContent = assistantMsg.liveFooter;
    }
  }, 150);

  let completed = false;
  try {
    const resp = await fetch(apiBase() + '/api/chat', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        conversation_id: state.currentConvId,
        message: text,
        model: useModel,
        partners,
        certain: !!state.certain,
        cwd: queuedItem?.cwd || state.conversationCwd || state.cwd,
        attachments: atts,
      }),
      signal: state.abortController.signal,
    });

    if (!resp.ok) throw new Error(await responseError(resp));
    if (!resp.headers.get('content-type')?.startsWith('text/event-stream') || !resp.body) {
      throw new Error('Serwer nie zwrócił strumienia odpowiedzi.');
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let ended = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop() || '';
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        try {
          const ev = JSON.parse(line.slice(5).trim());
          if (ev.type === 'done') ended = true;
          handleStreamEvent(ev, assistantMsg, tStart);
        } catch {}
      }
    }
    if (!ended) throw new Error('Strumień zakończył się przedwcześnie.');
    completed = assistantMsg.succeeded === true;
  } catch (e) {
    if (e.name === 'AbortError') {
      assistantMsg.footer = `Zatrzymano · ⏱ ${((Date.now() - tStart) / 1000).toFixed(1)}s`;
      assistantMsg.tools.forEach(tool => tool.live = false);
      renderMessages();
    } else {
      assistantMsg.text += `\n\n⚠ Błąd połączenia: ${e.message}`;
      renderMessages();
    }
  } finally {
    clearInterval(timerId);
    if (!assistantMsg.footer) {
      assistantMsg.footer = fmtUsageFooter((Date.now() - tStart) / 1000, assistantMsg._usage, '');
      renderMessages();
    }
    state.abortController = null;
    setStreaming(false);
    loadConversations();
    refreshLimits();
    if (!state.manualStop && completed) sendNextQueued();
  }
}

function handleStreamEvent(ev, msg, tStart) {
  if (ev.conversation_id && ev.conversation_id !== state.currentConvId && (ev.type === 'init' || !state.currentConvId)) {
    state.currentConvId = ev.conversation_id;
    document.getElementById('chatTitle').textContent = state.messages[0]?.text?.slice(0, 40) || ev.conversation_id.slice(0, 8);
  }
  if (ev.type === 'text_delta') {
    msg.text += ev.delta;
    renderMessages();
  } else if (ev.type === 'usage' && ev.usage) {
    msg._usage = ev.usage;
  } else if (ev.type === 'tool') {
    const label = ev.tool_name || ev.step_type || 'narzędzie';
    const existing = msg.tools.find(t => t.idx === ev.step_index && ev.step_index != null);
    if (existing) {
      existing.label = label;
      existing.live = ev.state !== 'DONE';
    } else {
      msg.tools.push({ idx: ev.step_index, label, live: ev.state !== 'DONE' });
    }
    renderMessages();
  } else if (ev.type === 'result') {
    msg.succeeded = ev.status === 'SUCCESS' && !ev.error;
    msg.route_id = ev.route_id;
    if (ev.response) msg.text = ev.response;
    if (ev.error) msg.text += `\n\n⚠ ${ev.error}`;
    msg.tools.forEach(t => t.live = false);
    const sec = ev.duration_seconds || ((Date.now() - (tStart || Date.now())) / 1000);
    const u = ev.usage && (ev.usage.total_tokens || ev.usage.input_tokens) ? ev.usage : msg._usage;
    msg.footer = fmtUsageFooter(sec, u, ev.model || '');
    renderMessages();
  } else if (ev.type === 'error') {
    msg.text += `\n\n⚠ ${ev.error}`;
    renderMessages();
  }
}

/* ===== VOICE DICTATION ===== */
let voiceBaseText = '';
let voiceStopping = false;
let voiceSendOnFinish = false;
let voiceHintTimer;

function setVoiceUi(active, hint = '') {
  clearTimeout(voiceHintTimer);
  state.listening = active;
  document.getElementById('btnMic').classList.toggle('listening', active);
  const h = document.getElementById('voiceHint');
  h.textContent = hint;
  h.classList.toggle('show', !!hint);
}

function writeDictation(text) {
  const box = document.getElementById('inputBox');
  box.value = [voiceBaseText, text.trim()].filter(Boolean).join(' ');
  autoGrow(box);
}

function finishDictation(send = false) {
  voiceSendOnFinish ||= send;
  if (!state.listening || voiceStopping) return;
  voiceStopping = true;
  setVoiceUi(true, 'Kończę dyktowanie…');
  if (window.AndroidVoice) window.AndroidVoice.stopListening();
  else state.recognition?.stop();
}

window.__androidVoicePartial = function(txt) {
  if (state.listening) writeDictation(txt);
};
window.__androidVoiceFinal = function(txt) {
  if (!state.listening) return;
  if (txt.trim()) writeDictation(txt);
  setVoiceUi(false);
  if (voiceSendOnFinish || (txt.trim() && state.autoSendVoice)) sendMessage();
};
window.__androidVoiceError = function(err) {
  if (!state.listening) return;
  setVoiceUi(false, err ? '🎙️ ' + err : '');
  if (err) voiceHintTimer = setTimeout(() => setVoiceUi(false), 2500);
};

function toggleMic() {
  if (state.streaming) return;
  if (state.listening) {
    finishDictation();
    return;
  }
  const box = document.getElementById('inputBox');
  voiceBaseText = box.value.trim();
  voiceStopping = false;
  voiceSendOnFinish = false;
  if (window.AndroidVoice) {
    setVoiceUi(true, '🎙️ Słucham…');
    window.AndroidVoice.startListening('pl-PL');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Ta przeglądarka nie obsługuje dyktowania. Użyj mikrofonu na klawiaturze lub aplikacji AIKO.');
    return;
  }
  const rec = new SR();
  let finalText = '';
  rec.lang = 'pl-PL';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (e) => {
    if (state.recognition !== rec) return;
    const results = Array.from(e.results);
    finalText = results.filter(result => result.isFinal).map(result => result[0].transcript.trim()).join(' ');
    const interim = results.filter(result => !result.isFinal).map(result => result[0].transcript.trim()).join(' ');
    writeDictation([finalText, interim].filter(Boolean).join(' '));
  };
  rec.onerror = (e) => {
    if (state.recognition !== rec) return;
    state.recognition = null;
    window.__androidVoiceError('Błąd mikrofonu: ' + e.error);
  };
  rec.onend = () => {
    if (state.recognition !== rec) return;
    state.recognition = null;
    window.__androidVoiceFinal(finalText);
  };
  state.recognition = rec;
  setVoiceUi(true, '🎙️ Słucham…');
  try {
    rec.start();
  } catch {
    state.recognition = null;
    window.__androidVoiceError('Nie udało się uruchomić mikrofonu');
  }
}

let _syncTick = 0;
setInterval(async () => {
  if (state.streaming || state.historyRequest || document.hidden) return;
  _syncTick++;
  if (_syncTick % 4 === 0) loadConversations();
  if (!state.currentConvId) return;
  try {
    const r = await fetch(apiBase() + `/api/conversations/${encodeURIComponent(state.currentConvId)}/messages`, { headers: authHeaders() });
    if (!r.ok) return;
    const data = await r.json();
    const fresh = data.messages || [];
    const lastOld = state.messages[state.messages.length - 1];
    const lastNew = fresh[fresh.length - 1];
    const changed = fresh.length !== state.messages.length
      || (lastNew && (!lastOld || lastNew.text !== lastOld.text || lastNew.role !== lastOld.role));
    if (changed && !state.streaming) {
      state.messages = fresh;
      renderMessages();
    }
  } catch {}
}, 1500);

// Swipe gesture: left->right opens sidebar, right->left closes sidebar
(function initSwipeSidebar() {
  let sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (e.target.closest('pre, code, input, textarea, select')) return;
    sx = t.clientX;
    sy = t.clientY;
    tracking = true;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!tracking || !e.changedTouches.length) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    const sb = document.getElementById('sidebar');
    const isOpen = sb.classList.contains('open');
    if (dx > 0 && !isOpen && sx < window.innerWidth * 0.65) {
      toggleSidebar(true);
    } else if (dx < 0 && isOpen) {
      toggleSidebar(false);
    }
  }, { passive: true });
})();
</script>
</body>
</html>
