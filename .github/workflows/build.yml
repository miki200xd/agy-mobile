name: Build AGY Mobile APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AGY_Mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AGY_Mobile
          path: AGY_Mobile.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: AGY Mobile v1.${{ github.run_number }}
          files: AGY_Mobile.apk
          make_latest: true
